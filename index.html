<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoodShop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<div id="toast-container"></div>

<body>
    <header>
        <div class="logo">
            <h1>GoodShop <i class="fa-solid fa-store"></i></h1>
        </div>
        <div class="cart-icon">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="cart-count">0</span>
        </div>
    </header>
    <div class="search-container">
        <input type="text" id="search-input" placeholder="Tìm kiếm sản phẩm...">
    </div>
    <div class="filter-container">
        <button class="filter-btn active" data-category="all">Tất cả</button>
        <button class="filter-btn" data-category="phụ kiện">Phụ kiện</button>
        <button class="filter-btn" data-category="chuột">Chuột</button>
        <button class="filter-btn" data-category="màn hình">Màn hình</button>
    </div>
    <main class="products-container" id="products-container"></main>
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h2>Giỏ hàng của bạn</h2>
            <button class="close-cart" id="close-cart">&times;</button>
        </div>

        <div class="cart-items" id="cart-items">
            <!-- Sản phẩm sẽ được render vào đây -->
        </div>

        <div class="cart-footer">
            <div class="total-price-container">
                <span>Tổng tiền:</span>
                <span id="total-price">0đ</span>
            </div>
            <button class="checkout-btn">Thanh toán ngay</button>
        </div>
    </div>
    <!-- Lớp nền mờ khi mở giỏ hàng -->
    <div class="cart-overlay" id="cart-overlay"></div>
    <!-- KẾT THÚC CHÈN -->
    <script src="index.js"></script>
</body>

</html>
