<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoodShop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<div id="toast-container"></div>

<body>
    <header>
        <div class="logo">
            <h1>GoodShop <i class="fa-solid fa-store"></i></h1>
        </div>
        <div class="cart-icon">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="cart-count">0</span>
        </div>
    </header>
    <div class="search-container">
        <input type="text" id="search-input" placeholder="Tìm kiếm sản phẩm...">
    </div>
    <div class="sort-container">
        <select id="sort-select">
            <option value="default">Sắp xếp mặc định</option>
            <option value="asc">Giá: Thấp đến Cao</option>
            <option value="desc">Giá: Cao đến Thấp</option>
        </select>
    </div>

    <div class="filter-container">
        <button class="filter-btn active" data-category="all">Tất cả</button>
        <button class="filter-btn" data-category="men's clothing">men outfit</button>
        <button class="filter-btn" data-category="women's clothing">women outfit</button>
        <button class="filter-btn" data-category="electronics">electronic</button>
    </div>
    <main class="products-container" id="products-container"></main>
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h2>Giỏ hàng của bạn</h2>
            <button class="close-cart" id="close-cart">&times;</button>
        </div>

        <div class="cart-items" id="cart-items">
            <!-- Sản phẩm sẽ được render vào đây -->
        </div>

        <div class="cart-footer">
            <div class="total-price-container">
                <span>Tổng tiền:</span>
                <span id="total-price">0đ</span>
            </div>
            <button class="checkout-btn">Thanh toán ngay</button>
        </div>
    </div>
    <!-- Lớp nền mờ khi mở giỏ hàng -->
    <div class="cart-overlay" id="cart-overlay"></div>
    <!-- Cửa sổ xem chi tiết (Quick View) -->
    <div class="quick-view-modal" id="quick-view-modal">
        <div class="modal-content">
            <button class="close-modal" id="close-modal">&times;</button>
            <div class="modal-body">
                <img id="modal-img" src="" alt="">
                <div class="modal-info">
                    <h2 id="modal-name">Tên sản phẩm</h2>
                    <p id="modal-price" class="price">Giá</p>
                    <p id="modal-category">Danh mục: <span></span></p>
                </div>
            </div>
        </div>
    </div>

    <!-- KẾT THÚC CHÈN -->
    <script src="index.js"></script>
</body>

</html>
